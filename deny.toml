# cargo-deny policy. Run with `cargo deny check` (same command as CI).
#
# AGENTS.md "Codigo": dependencies are added deliberately; keep this list short.

[advisories]
version = 2
# Never resolve to a yanked release.
yanked = "deny"

[licenses]
version = 2
# Only well-known permissive licenses. Expanding this list requires justification
# in the PR that needs it.
#
# NOTE (ADR-0007): `aws-lc-rs` and `ring` bundle OpenSSL-derived code under
# ISC/OpenSSL terms. If the H9 FIPS build lands, expect to add
# "OpenSSL" and "ISC" explicitly, with the justification in that PR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Workspace crates are unpublished (publish = false), so they carry no license field.
private = { ignore = true }

[bans]
# No wildcard requirements: a typo must not silently become a different crate.
wildcards = "deny"
multiple-versions = "warn"
# TLS and crypto must come from rustls/RustCrypto/aws-lc-rs, never OpenSSL.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]