# BandAll workspace. Layout follows the blueprint: crates/<x> => bandall-<x>.
[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/authenticator-core",
    "crates/embedded",
    "crates/cli",
    "crates/policy",
    "crates/sdk-axum",
    "crates/sigs",
    "crates/store",
    "crates/tokens",
    "crates/totp-core",
    "crates/vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Intra-workspace dependencies, declared once here with an explicit version.
#
# Two reasons (AGENTS.md "Codigo": `cargo deny` must pass):
#
#   1. `deny.toml` sets `bans.wildcards = "deny"`. A path-only dependency has
#      no version requirement, which cargo reads as `*`, so every intra-workspace
#      edge was reported as a wildcard. Stating the version satisfies the rule
#      without relaxing it.
#   2. The dependency graph is readable in one place instead of being spread
#      across ten manifests.
#
# The version is repeated from [workspace.package]; on a release bump both must
# move together (`docs/RELEASING.md` §Versionado).
[workspace.dependencies]
bandall-api = { path = "crates/api", version = "0.1.0" }
bandall-authenticator-core = { path = "crates/authenticator-core", version = "0.1.0" }
bandall-cli = { path = "crates/cli", version = "0.1.0" }
bandall-embedded = { path = "crates/embedded", version = "0.1.0" }
bandall-policy = { path = "crates/policy", version = "0.1.0" }
bandall-sdk-axum = { path = "crates/sdk-axum", version = "0.1.0" }
bandall-sigs = { path = "crates/sigs", version = "0.1.0" }
bandall-store = { path = "crates/store", version = "0.1.0" }
bandall-tokens = { path = "crates/tokens", version = "0.1.0" }
bandall-totp-core = { path = "crates/totp-core", version = "0.1.0" }
bandall-vault = { path = "crates/vault", version = "0.1.0" }

# Integer overflow must never be silent, not even in release (AGENTS.md
# "fail closed"): steps, counters and timestamps are all bounded domain values
# where wrapping would be a security bug rather than a performance win.
[profile.release]
overflow-checks = true
panic = "abort"
strip = "debuginfo"

[profile.test]
overflow-checks = true

# AGENTS.md "Seguridad": no unsafe code anywhere.
[workspace.lints.rust]
unsafe_code = "forbid"
# Rustdoc on every public item (AGENTS.md "Codigo").
missing_docs = "warn"
missing_debug_implementations = "warn"
trivial_numeric_casts = "deny"

# AGENTS.md "Codigo": no unwrap/expect/panic/indexing outside tests.
# Tests opt out via #![cfg_attr(test, allow(...))] in each crate root.
#
# print_stdout/print_stderr are denied here, so the CLI crate re-enables them
# locally (it is the only binary). Everything else applies workspace-wide.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# No lossy integer conversions (`as`) outside tests: same rationale as above.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# No leftover debug hooks or placeholders in shipped code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The CLI is the only place allowed to print; libraries stay silent.
print_stdout = "deny"
print_stderr = "deny"
