[package]
name = "bandall-totp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Crypto: RustCrypto HMAC + SHA families. No custom crypto (AGENTS.md).
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Constant-time code comparison.
subtle = "2"
# Secret handling: zeroed on drop, redacted Debug.
secrecy = "0.10"
# OS CSPRNG for secret generation.
getrandom = "0.2"
# Strict Base32 (RFC 4648) encode/decode.
data-encoding = "2"
# Typed errors.
thiserror = "2"

[dev-dependencies]
# Property tests for the parsers and the TOTP maths (H1, roadmap item 8):
# these look for counterexamples the fixed RFC vectors cannot reach.
proptest = "1"
# Benchmarks of the hot paths (H1, roadmap item 8). `cargo bench` only: the
# gate has no performance threshold, since measured SLOs are H8.
criterion = "0.5"

[[bench]]
name = "hot_paths"
harness = false
