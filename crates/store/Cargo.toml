[package]
name = "bandall-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure rate-limit decision table shared with the API (T2).
bandall-policy = { workspace = true }
# Parse Postgres URLs to enforce TLS on remote hosts (ADR-0008 / T9.1).
url = "2.5"
# Unified Postgres + SQLite access with migrations.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "macros", "migrate"] }
# Async runtime (tests and Exector bounds).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Random TEXT ids (uuid v4).
uuid = { version = "1", features = ["v4"] }
# Typed errors.
thiserror = "2"

[dev-dependencies]
# Modo embebido (H6): el ejemplo `embedded` junta la matemática pura con la
# persistencia SQLite y el cifrado en reposo, sin red ni HTTP.
bandall-totp-core = { workspace = true }
bandall-vault = { workspace = true }
# Ejemplo embebido: leer el plaintext abierto (SecretBox) con el trait de
# `secrecy` (ya es dependencia transitiva del vault; se declara aquí porque el
# ejemplo lo usa directamente).
secrecy = "0.10"