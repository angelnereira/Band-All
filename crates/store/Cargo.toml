[package]
name = "bandall-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure rate-limit decision table shared with the API (T2).
bandall-policy = { workspace = true }
# Parse Postgres URLs to enforce TLS on remote hosts (ADR-0008 / T9.1).
url = "2.5"
# Unified Postgres + SQLite access with migrations.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "macros", "migrate"] }
# Async runtime (tests and Exector bounds).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Random TEXT ids (uuid v4).
uuid = { version = "1", features = ["v4"] }
# Typed errors.
thiserror = "2"

[dev-dependencies]
# El modo embebido vive ahora en `bandall-embedded` (ADR-0014): el ejemplo que
# antes estaba aquí se movió a `crates/embedded/examples/embedded.rs`.
# Sin dev-dependencies propias: la batería de `store` usa el crate mismo.