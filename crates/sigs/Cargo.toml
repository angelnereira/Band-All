[package]
name = "bandall-sigs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# HMAC-SHA-256 request signatures. No custom crypto.
hmac = "0.12"
sha2 = "0.10"
# Constant-time signature comparison.
subtle = "2"
# OS CSPRNG for nonces.
getrandom = "0.2"
# Typed errors.
thiserror = "2"

[dev-dependencies]
# Conformance-vector parsing (tests only).
serde_json = "1"
