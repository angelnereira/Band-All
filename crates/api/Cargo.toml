[package]
name = "bandall-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bandall-totp-core = { path = "../totp-core" }
bandall-vault = { path = "../vault" }
bandall-store = { path = "../store" }
bandall-tokens = { path = "../tokens" }
# HTTP: axum + tower middleware stack.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "cors"] }
# Config (TOML) and JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Generated OpenAPI (served at /openapi.json for SDK codegen in H6).
utoipa = "5"
# Constant-time service-key comparison.
subtle = "2"
# Secret hygiene for transient plaintext copies.
secrecy = "0.10"
# Ad-hoc error context (never surfaced to clients).
anyhow = "1"
# Typed errors.
thiserror = "2"
