[package]
name = "bandall-authenticator-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bandall-totp-core = { path = "../totp-core" }
# Encrypted backup (Argon2id + XChaCha20-Poly1305).
argon2 = "0.5"
password-hash = "0.5"
chacha20poly1305 = "0.10"
# OS CSPRNG for backup salts and nonces.
getrandom = "0.2"
# Account import/export.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Strict Base32 for backup envelopes.
data-encoding = "2"
# Typed errors.
thiserror = "2"
