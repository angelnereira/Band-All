# Minimal BandAll config for the observability stack (SQLite keeps it local).
listen = "0.0.0.0:8080"
database = "sqlite"
database_url = "sqlite:/data/bandall.db"
kms_key_file = "/run/secrets/bandall-kek"
kek_id = "kek-obs"
audit_key_file = "/run/secrets/bandall-audit-key"
service_key = "demo-service-key-0123456789abcdef"
token_issuer = "bandall-obs"
token_audience = "obs-app"
keys_dir = "/data/keys"
