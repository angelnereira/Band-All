# Local development stack. The bandall API service arrives in H3.
#   docker compose -f deploy/compose/compose.yaml up -d
name: bandall-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bandall
      # Dev-only default. Override with POSTGRES_PASSWORD in the environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bandall-dev-only}
      POSTGRES_DB: bandall
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandall -d bandall"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host port defaults to 5433: 5432 is already taken on this machine by
      # another project's Postgres (PlentyPay). Override with POSTGRES_PORT.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
