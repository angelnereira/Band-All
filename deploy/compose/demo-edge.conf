# Edge proxy: everything behind BandAll forward-auth.
server {
    listen 80;

    # Subrequest validated by BandAll; 200 carries identity headers.
    location = /auth {
        internal;
        proxy_pass http://bandall:8080/v1/authz/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        auth_request /auth;
        auth_request_set $bandall_subject $upstream_http_x_bandall_subject;
        auth_request_set $bandall_tenant $upstream_http_x_bandall_tenant;
        proxy_set_header X-Bandall-Subject $bandall_subject;
        proxy_set_header X-Bandall-Tenant $bandall_tenant;
        proxy_pass http://legacy:80;
    }
}
