name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new push cancels the previous, queued run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every third-party action is pinned by the commit SHA of an exact release tag
# (never a floating major tag). Each pin was resolved with:
#
#   git ls-remote https://github.com/<owner>/<repo>.git 'refs/tags/<tag>*'
#
# and, for annotated tags, dereferenced to the commit (`^{}`). To bump a pin:
# resolve the new tag, replace the SHA, update the `# vX.Y.Z` comment.

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bandall
          POSTGRES_PASSWORD: bandall-ci-only
          POSTGRES_DB: bandall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandall -d bandall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BANDALL_TEST_PG: postgres://bandall:bandall-ci-only@localhost:5432/bandall
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # branch 1.99.0
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@0acae73baee12cc81c9b1fb9e8f8b7672bf17c6a # branch 1.85.0
        with:
          toolchain: 1.85.0
      # `+` overrides the pinned rust-toolchain.toml on purpose.
      - run: cargo +1.85.0 check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Same ignore as `just audit`, with the reasoning there: RUSTSEC-2023-0071
          # only reaches the graph via `rsa` <- `sqlx-mysql`, an optional sqlx
          # feature this workspace never enables. No upstream fix exists.
          ignore: RUSTSEC-2023-0071

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # branch 1.99.0
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov
      # Gate from AGENTS.md: totp-core coverage > 90%.
      - run: cargo llvm-cov -p bandall-totp-core --locked --fail-under-lines 90
      # Full report for humans (threshold applies to the core above only while
      # H2-H6 gates are still open).
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

  sdks:
    name: sdk conformance vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node --test test/vectors.test.ts
        working-directory: sdks/ts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install cryptography
      - run: python -m unittest discover -s tests -v
        working-directory: sdks/python
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./...
        working-directory: sdks/go
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/BandAll.Tests/BandAll.Tests.csproj
        working-directory: sdks/csharp

  trivy:
    name: filesystem and dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max