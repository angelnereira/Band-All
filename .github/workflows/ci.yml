name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bound every job so a hung step cannot burn the runner budget.
defaults:
  run:
    timeout-minutes: 20

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bandall
          POSTGRES_PASSWORD: bandall-ci-only
          POSTGRES_DB: bandall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandall -d bandall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BANDALL_TEST_PG: postgres://bandall:bandall-ci-only@localhost:5432/bandall
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      # `+` overrides the pinned rust-toolchain.toml on purpose.
      - run: cargo +1.85.0 check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

  sdks:
    name: sdk conformance vectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/vectors.test.ts
        working-directory: sdks/ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cryptography
      - run: python -m unittest discover -s tests -v
        working-directory: sdks/python

  trivy:
    name: filesystem and dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max