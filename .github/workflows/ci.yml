name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bound every job so a hung step cannot burn the runner budget.
defaults:
  run:
    timeout-minutes: 20

# Third-party actions are pinned by commit SHA, not by tag: a compromised tag
# must not be able to run with our secrets. Refresh the pins like dependency
# updates (comment keeps the tag and date for humans).
#
# actions/checkout@v4.2.2 (2024-11-01)
# dtolnay/rust-toolchain branch 1.98.1 (bumped with the toolchain; the
#   `toolchain:` input still selects the version explicitly)
# Swatinem/rust-cache@v2.8.0 (2025-03-06)
# EmbarkStudios/cargo-deny-action@v2 tip (2025-06-12)
# rustsec/audit-check@v2.0.0 (2025-03-19)
# taiki-e/install-action@v2 tip (2025-06-18)
# actions/setup-node@v4.4.0 (2025-05-20)
# actions/setup-python@v5.6.0 (2025-04-30)
# docker/setup-buildx-action@v3.10.0 (2025-05-01)
# docker/build-push-action@v6.16.0 (2025-06-11)
# aquasecurity/trivy-action@v0.33.1 (2025-06-30)

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bandall
          POSTGRES_PASSWORD: bandall-ci-only
          POSTGRES_DB: bandall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandall -d bandall"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BANDALL_TEST_PG: postgres://bandall:bandall-ci-only@localhost:5432/bandall
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290
        with:
          toolchain: 1.85.0
      # `+` overrides the pinned rust-toolchain.toml on purpose.
      - run: cargo +1.85.0 check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@c6590455eca8e79d081430ebfe2074192ae90290
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

  sdks:
    name: sdk conformance vectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test test/vectors.test.ts
        working-directory: sdks/ts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pip install cryptography
      - run: python -m unittest discover -s tests -v
        working-directory: sdks/python

  trivy:
    name: filesystem and dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max